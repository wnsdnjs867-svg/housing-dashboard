name: Update housing dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 주택공고 다시 수집
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: python update_dashboard.py

      - name: 새 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html housing_notices.xlsx housing_map.html
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "자동 주택공고 갱신"
            git push
          fi
